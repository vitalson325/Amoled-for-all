<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AMOLED Maker</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0C0C0E;
            --card-item-bg: #0B0B0C;
            --accent-gold: #c68a3e;
            --accent-green: #0E3F11;
            --text-white: #ffffff;
            --text-gray: #777777;
            --border-color: #222226;
            --glass-border: rgba(40, 40, 48, 0.6);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка в стиле референса */
        .app-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 10px 20px;
            z-index: 50;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.3px;
        }

        .header-status-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            background: var(--card-item-bg);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            color: var(--text-gray);
        }

        .header-icon-btn {
            background: var(--card-item-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--accent-gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5px 20px;
            overflow-y: auto;
            padding-bottom: 95px;
        }

        /* Кнопка питания */
        .power-btn-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .power-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a22 0%, #0c0c0e 100%);
            border: 2px solid var(--accent-gold);
            outline: 2px solid var(--accent-gold);
            outline-offset: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(198, 138, 62, 0.25);
            position: relative;
            transition: all 0.2s ease;
        }

        .power-btn:active {
            transform: scale(0.95);
        }

        .power-icon {
            width: 36px;
            height: 36px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .power-icon::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 44%;
            transform: translateX(-50%);
            width: 8px;
            height: 16px;
            background-color: var(--accent-gold);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--accent-gold);
        }
        .power-icon::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 44%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            border: 3px solid var(--accent-gold);
            border-radius: 50%;
            border-top-color: transparent;
            box-shadow: 0 0 8px var(--accent-gold);
        }

        .connection-status {
            margin-top: 18px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-white);
            text-align: center;
        }

        .action-prompt {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-gray);
            text-align: center;
        }

        /* Карточки */
        .card-capsule {
            width: 100%;
            max-width: 400px;
            background: var(--card-item-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .card-capsule:active {
            transform: scale(0.98);
        }

        .card-icon-box {
            width: 40px;
            height: 40px;
            background: #141418;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .card-text-area {
            flex: 1;
            padding-left: 14px;
            overflow: hidden;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-right {
            color: var(--text-gray);
            font-size: 16px;
            padding-left: 10px;
        }

        /* Кнопка конвертации */
        .action-pill-btn {
            width: 100%;
            max-width: 400px;
            height: 52px;
            background: var(--card-item-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .action-pill-btn:active {
            transform: scale(0.98);
        }

        /* Логи */
        .logs-container {
            width: 100%;
            max-width: 400px;
            height: 120px;
            background: var(--card-item-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-top: 15px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #115314;
            overflow-y: auto;
            text-align: left;
        }

        #fileInput, #dirInput {
            display: none;
        }

        /* Нижний док с нашими 4 вкладками */
        .bottom-nav-container {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            z-index: 100;
        }

        .bottom-capsule-bar {
            width: 100%;
            max-width: 420px;
            height: 70px;
            background: rgba(12, 12, 14, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 35px;
            display: flex;
            position: relative;
            padding: 5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .active-indicator {
            position: absolute;
            top: 5px;
            bottom: 5px;
            width: calc(25% - 6px);
            background: #18181c;
            border: 1px solid #2a2a30;
            border-radius: 30px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            flex: 1;
            font-size: 11px;
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-card {
            width: 90%;
            max-width: 420px;
            height: 80vh;
            background: rgba(20, 20, 24, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            font-weight: bold;
            color: var(--text-white);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 22px;
            cursor: pointer;
        }

        .modal-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .glass-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--card-item-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .glass-btn.primary {
            background: rgba(198, 138, 62, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .glass-input {
            width: 100%;
            padding: 12px;
            background: var(--card-item-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 12px;
            margin-bottom: 12px;
            outline: none;
            font-size: 13px;
        }

        .patch-item {
            background: var(--card-item-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="app-header">
        <div class="app-title">AMOLED Maker</div>
        <div class="header-status-group">
            <div class="status-pill">Готов</div>
            <button class="header-icon-btn" onclick="triggerConversion()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </button>
        </div>
    </div>

    <div class="main-container">
        <!-- Кнопка питания -->
        <div class="power-btn-container">
            <div class="power-btn" onclick="triggerConversion()">
                <div class="power-icon"></div>
            </div>
            <div class="connection-status">Готово к конвертации</div>
            <div class="action-prompt">Нажмите кнопку, чтобы запустить процесс</div>
        </div>

        <!-- Выбор APK -->
        <div class="card-capsule" onclick="triggerFileSelect()">
            <div class="card-icon-box">📦</div>
            <div class="card-text-area">
                <div class="card-subtitle">Целевой APK</div>
                <div class="card-title" id="mainTitle">APK не выбран</div>
            </div>
            <div class="arrow-right">›</div>
        </div>

        <!-- Выбор рабочей папки -->
        <div class="card-capsule" onclick="triggerDirSelect()">
            <div class="card-icon-box">📁</div>
            <div class="card-text-area">
                <div class="card-subtitle">Директория</div>
                <div class="card-title" id="folderTitle">Рабочая папка: не выбрана</div>
            </div>
            <div class="arrow-right">›</div>
        </div>

        <!-- Кнопка действия -->
        <button class="action-pill-btn" onclick="triggerConversion()">
            ⚡ Начать конвертацию APK
        </button>

        <input type="file" id="fileInput" accept=".apk">
        <input type="file" id="dirInput" webkitdirectory directory style="display:none;">

        <!-- Логи -->
        <div class="logs-container" id="logsBox">
            [System] Готово к работе в AMOLED стиле...
        </div>
    </div>

    <!-- Нижняя панель с нашими 4 вкладками: Иконки, Текст, Цвета, Патчи -->
    <div class="bottom-nav-container">
        <div class="bottom-capsule-bar">
            <div class="active-indicator" id="navIndicator" style="transform: translateX(0%);"></div>
            
            <button class="nav-item active" onclick="switchTab(0, 'iconsTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4h7v7H4V4m9 0h7v7h-7V4M4 13h7v7H4v-7m9 0h7v7h-7v-7Z"/></svg>
                Иконки
            </button>
            <button class="nav-item" onclick="switchTab(1, 'textTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 5v14h18V5H3m16 12H5V7h14v10M7 9h10v2H7V9m0 4h7v2H7v-2Z"/></svg>
                Текст
            </button>
            <button class="nav-item" onclick="switchTab(2, 'colorsTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h4.15c1.07.62 2.34 1 3.5 1 4.97 0 9-4.03 9-9s-4.03-9-9-9m0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7m1-11h-2v4H8v2h3v4h2v-4h3v-2h-3V8Z"/></svg>
                Цвета
            </button>
            <button class="nav-item" onclick="switchTab(3, 'patchesTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                Патчи
            </button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalTitle">Раздел</span>
                <button class="close-modal" onclick="closeTab()">×</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dirInput = document.getElementById('dirInput');
        const mainTitle = document.getElementById('mainTitle');
        const folderTitle = document.getElementById('folderTitle');
        const logsBox = document.getElementById('logsBox');
        let selectedFile = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
                try {
                    window.Capacitor.Plugins.StatusBar.setBackgroundColor({ color: '#000000' });
                    window.Capacitor.Plugins.StatusBar.setStyle({ style: 'DARK' });
                    window.Capacitor.Plugins.StatusBar.show();
                } catch (e) {}
            }
        });

        function triggerFileSelect() { fileInput.click(); }
        function triggerDirSelect() { dirInput.click(); }

        function triggerConversion() {
            if (!selectedFile) {
                fileInput.click();
            } else {
                logMessage(`[Process] Запуск конвертации: ${selectedFile.name}...`);
            }
        }

        fileInput.addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                selectedFile = event.target.files[0];
                mainTitle.textContent = selectedFile.name;
                logMessage(`[OK] Выбран APK: ${selectedFile.name}`);
            }
        });

        dirInput.addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                const folderPath = event.target.files[0].webkitRelativePath.split('/')[0] || "Выбранная папка";
                folderTitle.textContent = `Папка: ${folderPath}`;
                logMessage(`[OK] Директория: ${folderPath}`);
            }
        });

        function logMessage(text) {
            logsBox.innerHTML += `<br>${text}`;
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const navIndicator = document.getElementById('navIndicator');
        const navItems = document.querySelectorAll('.nav-item');

        function switchTab(index, tabName) {
            navIndicator.style.transform = `translateX(${index * 100}%)`;
            
            navItems.forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            modalOverlay.style.display = 'flex';
            
            if (tabName === 'iconsTab') {
                modalTitle.textContent = "Иконки APK";
                modalContent.innerHTML = `
                    <p style="color:#888; font-size:13px; margin-bottom:12px;">Обнаруженные иконки для замены:</p>
                    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:15px;">
                        <div style="background:var(--card-item-bg); padding:12px; border-radius:12px; text-align:center; border:1px solid var(--border-color);">
                            <div style="font-size:28px;">🖼️</div>
                            <div style="font-size:11px; margin-top:5px; color:#fff;">ic_launcher.png</div>
                        </div>
                        <div style="background:var(--card-item-bg); padding:12px; border-radius:12px; text-align:center; border:1px solid var(--border-color);">
                            <div style="font-size:28px;">⚙️</div>
                            <div style="font-size:11px; margin-top:5px; color:#fff;">ic_settings.png</div>
                        </div>
                    </div>
                    <button class="glass-btn primary" onclick="logMessage('[Icons] Загрузка пользовательской иконки...')">📂 Загрузить свою иконку</button>
                `;
            } else if (tabName === 'textTab') {
                modalTitle.textContent = "Поиск и замена текста";
                modalContent.innerHTML = `
                    <input type="text" class="glass-input" placeholder="Поиск строки в APK...">
                    <input type="text" class="glass-input" placeholder="Заменить на...">
                    <button class="glass-btn primary" onclick="logMessage('[Text] Выполнен поиск и замена строк')">Найти и заменить</button>
                `;
            } else if (tabName === 'colorsTab') {
                modalTitle.textContent = "Цвета: AMOLED Оптимизация";
                modalContent.innerHTML = `
                    <button class="glass-btn primary" onclick="logMessage('[Preset] Применена умная инверсия белого')">⚡ Умная инверсия белого (#FFF -> #000)</button>
                    <button class="glass-btn" onclick="logMessage('[Preset] Акценты сохранены')">🎨 Сохранить фирменные акценты</button>
                    <hr style="border-color:var(--border-color); margin:15px 0;">
                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">background_color</div>
                            <div style="font-size:11px; color:#888;">#FFFFFF ➔ #000000</div>
                        </div>
                        <div style="background:#000000; color:#fff; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:10px; border:1px solid #444;">Фон</div>
                    </div>
                `;
            } else if (tabName === 'patchesTab') {
                modalTitle.textContent = "Дополнительные патчи";
                modalContent.innerHTML = `
                    <p style="color:#888; font-size:12px; margin-bottom:12px;">Инструменты модификации и сборки:</p>
                    
                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">📝 Изменить Package Name</div>
                            <div style="font-size:11px; color:#888;">Клонирование / Смена ID пакета</div>
                        </div>
                        <button class="glass-btn primary" style="width:auto; padding:6px 12px; margin:0; font-size:11px;" onclick="logMessage('[Patch] Выбрана смена Package Name')">Изменить</button>
                    </div>

                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">🔏 Переподписать APK</div>
                            <div style="font-size:11px; color:#888;">Подпись тестовым ключом</div>
                        </div>
                        <button class="glass-btn primary" style="width:auto; padding:6px 12px; margin:0; font-size:11px;" onclick="logMessage('[Patch] Запущена переподпись APK')">Патч</button>
                    </div>

                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">🧹 Очистка мусора</div>
                            <div style="font-size:11px; color:#888;">Удаление лишних языков/трекеров</div>
                        </div>
                        <button class="glass-btn primary" style="width:auto; padding:6px 12px; margin:0; font-size:11px;" onclick="logMessage('[Patch] Выполнена очистка ресурсов')">Очистить</button>
                    </div>
                `;
            }
        }

        function closeTab() {
            modalOverlay.style.display = 'none';
        }

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeTab();
        });
    </script>
</body>
</html>
