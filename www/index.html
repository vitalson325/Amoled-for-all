<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOLED Maker</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #00ff66;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #888888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #111111;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }
        #status {
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #ffaa00;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>AMOLED Maker</h1>
    <p>Конвертация APK в глубокий черный стиль</p>

    <button class="btn" onclick="selectApp()">Выбрать APK</button>
    <button class="btn" onclick="startProcess()" style="border-color: #00bfff; color: #00bfff;">Сделать AMOLED</button>

    <div id="status">Готово к работе</div>

    <script>
        function selectApp() {
            document.getElementById("status").innerText = "Выбери APK из папки Загрузки";
        }

        function startProcess() {
            document.getElementById("status").innerText = "Запуск процесса конвертации...";
        }
    </script>
</body>
</html>
