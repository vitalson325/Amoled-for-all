<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmoledMakerApp</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(18, 18, 18, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #00ff66;
            --accent-hover: #00cc52;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0 0 16px 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        /* Скрываем системный инпут файлов */
        #fileInput {
            display: none;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .file-name-display {
            color: var(--accent-color);
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 12px 0 20px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-secondary:active {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>AmoledMakerApp</h1>
            <p>Превратите интерфейс вашего APK в глубокий черный стиль для AMOLED-экранов.</p>
            <button class="btn" id="selectBtn">Выбрать APK файл</button>
        </div>
    </div>

    <!-- Скрытый инпут для выбора файлов -->
    <input type="file" id="fileInput" accept=".apk">

    <!-- Модальное окно подтверждения -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-title">Подтвердите выбор</div>
            <p style="margin-bottom: 8px;">Вы выбрали следующий файл для обработки:</p>
            <div class="file-name-display" id="fileNameDisplay">filename.apk</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
                <button class="btn" id="confirmBtn">Готово</button>
            </div>
        </div>
    </div>

    <script>
        const selectBtn = document.getElementById('selectBtn');
        const fileInput = document.getElementById('fileInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        let selectedFile = null;

        // Кнопка открытия выбора файла
        selectBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Обработка выбора файла через системный диалог
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                modalOverlay.classList.add('active');
            }
        });

        // Кнопка отмены в модалке
        cancelBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('icon-active') || modalOverlay.classList.remove('active');
            fileInput.value = '';
            selectedFile = null;
        });

        // Кнопка подтверждения в модалке
        confirmBtn.addEventListener('click', () => {
            if (selectedFile) {
                alert('Файл "' + selectedFile.name + '" успешно принят в работу!');
                // Здесь будет дальнейшая логика отправки файла на обработку
            }
            modalOverlay.classList.remove('active');
            fileInput.value = '';
        });
    </script>
</body>
</html>
