<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AMOLED Maker</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0C0C0E;
            --panel-modal: #1a1a1a;
            --accent-green: #0E3F11;
            --accent-blue: #0088ff;
            --text-white: #ffffff;
            --text-gray: #777777;
            --border-color: #222226;
            --ring-gold: #c68a3e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: linear-gradient(to bottom, #000 0%, #000 100%);
        }

        /* Верхняя панель с кнопкой Настроек справа */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 12px 20px 0 20px;
            z-index: 50;
        }

        .top-settings-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-gray);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: color 0.2s;
        }
        .top-settings-btn:active {
            transform: scale(0.92);
        }
        .top-settings-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 20px;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        .power-btn-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Исправленная центрированная круглая кнопка */
        .power-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 2px solid var(--ring-gold);
            outline: 2px solid var(--ring-gold);
            outline-offset: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(198, 138, 62, 0.2);
            position: relative;
            transition: all 0.2s ease;
        }

        .power-btn:active {
            transform: scale(0.95);
        }

        .power-icon {
            width: 32px;
            height: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .power-icon::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 12px;
            width: 8px;
            height: 18px;
            background-color: var(--ring-gold);
            border-radius: 4px;
            box-shadow: 0 0 8px var(--ring-gold);
        }
        .power-icon::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 1px;
            width: 30px;
            height: 30px;
            border: 3px solid var(--ring-gold);
            border-radius: 50%;
            border-top-color: transparent;
            box-shadow: 0 0 8px var(--ring-gold);
        }

        .action-prompt {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-gray);
            text-align: center;
            letter-spacing: 0.2px;
        }

        .selector-capsule {
            width: 100%;
            max-width: 400px;
            height: 65px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .selector-capsule:active {
            transform: scale(0.98);
        }

        .plus-icon-circle {
            width: 45px;
            height: 45px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .plus-sign {
            font-size: 26px;
            color: var(--accent-green);
            font-weight: 300;
            line-height: 1;
        }

        .capsule-text-area {
            flex: 1;
            padding-left: 15px;
            overflow: hidden;
        }

        .status-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-right {
            color: var(--text-gray);
            font-size: 16px;
            padding-right: 15px;
        }

        #fileInput {
            display: none;
        }

        .logs-container {
            width: 100%;
            max-width: 400px;
            height: 150px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-top: 15px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-green);
            overflow-y: auto;
            text-align: left;
        }

        /* Нижняя панель с эффектом матового стекла и точным выравниванием */
        .bottom-nav-container {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            z-index: 100;
        }

        .bottom-capsule-bar {
            width: 100%;
            max-width: 420px;
            height: 70px;
            background: rgba(12, 12, 14, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 35px;
            display: flex;
            position: relative;
            padding: 5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .active-indicator {
            position: absolute;
            top: 5px;
            bottom: 5px;
            width: calc(25% - 6px);
            background: #18181c;
            border: 1px solid #2a2a30;
            border-radius: 30px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            flex: 1;
            font-size: 11px;
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--accent-green);
            font-weight: 600;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-card {
            width: 90%;
            max-width: 420px;
            height: 80vh;
            background: var(--panel-modal);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-white);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .patch-item {
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preset-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #1f1f1f;
            border: 1px solid var(--accent-green);
            color: var(--text-white);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Верхняя шапка с кнопкой настроек справа -->
    <div class="top-header">
        <button class="top-settings-btn" onclick="openTab(3, 'settingsTab')">
            <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.65.07-.97 0-.32-.03-.65-.07-.97l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.63c-.04.32-.07.65-.07.97 0 .32.03.65.07.97l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.63Z"/></svg>
        </button>
    </div>

    <div class="main-container">
        <!-- Круглая кнопка запуска -->
        <div class="power-btn-container">
            <div class="power-btn" onclick="triggerConversion()">
                <div class="power-icon"></div>
            </div>
            <div class="action-prompt" id="actionPrompt">Выберите APK для конвертации</div>
        </div>

        <!-- Капсула выбора APK -->
        <div class="selector-capsule" onclick="triggerFileSelect()">
            <div class="plus-icon-circle">
                <span class="plus-sign">+</span>
            </div>
            <div class="capsule-text-area">
                <div class="status-title" id="mainTitle">APK не выбран</div>
            </div>
            <div class="arrow-right">›</div>
        </div>

        <input type="file" id="fileInput" accept=".apk">

        <!-- Логи -->
        <div class="logs-container" id="logsBox">
            [System] Готово к работе. Выберите APK для начала анализа...
        </div>
    </div>

    <!-- Нижняя панель с вкладкой "Дополнительно" (патчи) на месте настроек -->
    <div class="bottom-nav-container">
        <div class="bottom-capsule-bar">
            <div class="active-indicator" id="navIndicator" style="transform: translateX(0%);"></div>
            
            <button class="nav-item active" onclick="switchTab(0, 'iconsTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4h7v7H4V4m9 0h7v7h-7V4M4 13h7v7H4v-7m9 0h7v7h-7v-7Z"/></svg>
                Иконки
            </button>
            <button class="nav-item" onclick="switchTab(1, 'textTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 5v14h18V5H3m16 12H5V7h14v10M7 9h10v2H7V9m0 4h7v2H7v-2Z"/></svg>
                Текст
            </button>
            <button class="nav-item" onclick="switchTab(2, 'colorsTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h4.15c1.07.62 2.34 1 3.5 1 4.97 0 9-4.03 9-9s-4.03-9-9-9m0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7m1-11h-2v4H8v2h3v4h2v-4h3v-2h-3V8Z"/></svg>
                Цвета
            </button>
            <button class="nav-item" onclick="switchTab(3, 'patchesTab')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                Патчи
            </button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalTitle">Вкладка</span>
                <button class="close-modal" onclick="closeTab()">×</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const mainTitle = document.getElementById('mainTitle');
        const actionPrompt = document.getElementById('actionPrompt');
        const logsBox = document.getElementById('logsBox');
        let selectedFile = null;

        function triggerFileSelect() {
            fileInput.click();
        }

        function triggerConversion() {
            if (!selectedFile) {
                fileInput.click();
            } else {
                logMessage(`[Process] Запуск конвертации файла: ${selectedFile.name}...`);
            }
        }

        fileInput.addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                selectedFile = event.target.files[0];
                mainTitle.textContent = selectedFile.name;
                actionPrompt.textContent = "Нажмите для запуска конвертации";
                logMessage(`[OK] Выбран файл: ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(2)} MB)`);
            }
        });

        function logMessage(text) {
            logsBox.innerHTML += `<br>${text}`;
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const navIndicator = document.getElementById('navIndicator');
        const navItems = document.querySelectorAll('.nav-item');

        function switchTab(index, tabName) {
            navIndicator.style.transform = `translateX(${index * 100}%)`;
            
            navItems.forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            modalOverlay.style.display = 'flex';
            
            if (tabName === 'iconsTab') {
                modalTitle.textContent = "Иконки APK";
                modalContent.innerHTML = `
                    <p style="color:#888; font-size:13px;">Обнаруженные иконки интерфейса для замены:</p>
                    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px;">
                        <div style="background:#111; padding:10px; border-radius:8px; text-align:center; border:1px solid #333;">
                            <div style="font-size:24px;">🖼️</div>
                            <div style="font-size:10px; margin-top:5px; color:#0E3F11; font-weight:bold;">ic_launcher.png</div>
                        </div>
                        <div style="background:#111; padding:10px; border-radius:8px; text-align:center; border:1px solid #333;">
                            <div style="font-size:24px;">⚙️</div>
                            <div style="font-size:10px; margin-top:5px; color:#0E3F11; font-weight:bold;">ic_settings.png</div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'textTab') {
                modalTitle.textContent = "Поиск и замена текста";
                modalContent.innerHTML = `
                    <input type="text" placeholder="Поиск строки в APK..." style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:10px;">
                    <input type="text" placeholder="Заменить на..." style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:10px;">
                    <button style="width:100%; padding:10px; background:var(--accent-blue); border:none; color:#fff; border-radius:8px; font-weight:bold;">Найти и заменить</button>
                `;
            } else if (tabName === 'colorsTab') {
                modalTitle.textContent = "Цвета: AMOLED Оптимизация";
                modalContent.innerHTML = `
                    <div class="preset-btn" onclick="logMessage('[Preset] Применена умная инверсия белого')">⚡ Умная инверсия белого (#FFF -> #000)</div>
                    <div class="preset-btn" onclick="logMessage('[Preset] Акценты сохранены')">🎨 Сохранить фирменные акценты</div>
                    <hr style="border-color:#222; margin:15px 0;">
                    <p style="color:#888; font-size:12px; margin-bottom:10px;">Параметры палитры с превью:</p>
                    
                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">background_color</div>
                            <div style="font-size:11px; color:#888;">#FFFFFF ➔ #000000</div>
                        </div>
                        <div style="background:#000000; color:#fff; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:10px;">Фон</div>
                    </div>
                `;
            } else if (tabName === 'patchesTab') {
                modalTitle.textContent = "Дополнительные патчи";
                modalContent.innerHTML = `
                    <p style="color:#888; font-size:12px; margin-bottom:12px;">Инструменты модификации и сборки:</p>
                    
                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">📝 Изменить Package Name</div>
                            <div style="font-size:11px; color:#888;">Клонирование / Смена ID пакета</div>
                        </div>
                        <button onclick="logMessage('[Patch] Выбрана смена Package Name')" style="background:#222; border:1px solid var(--accent-green); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:11px;">Изменить</button>
                    </div>

                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">🔏 Переподписать APK</div>
                            <div style="font-size:11px; color:#888;">Подпись тестовым ключом debug.keystore</div>
                        </div>
                        <button onclick="logMessage('[Patch] Запущена переподпись APK')" style="background:#222; border:1px solid var(--accent-green); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:11px;">Патч</button>
                    </div>

                    <div class="patch-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">🧹 Очистка мусора и трекеров</div>
                            <div style="font-size:11px; color:#888;">Удаление лишних языков и метаданных</div>
                        </div>
                        <button onclick="logMessage('[Patch] Выполнена очистка ресурсов')" style="background:#222; border:1px solid var(--accent-green); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:11px;">Очистить</button>
                    </div>
                `;
            } else if (tabName === 'settingsTab') {
                modalTitle.textContent = "Настройки приложения";
                modalContent.innerHTML = `
                    <p style="color:#aaa; font-size:14px;">Версия сборки: 1.1.3 (AMOLED Core)</p>
                    <p style="color:#aaa; font-size:14px;">GitHub Actions: Активно</p>
                `;
            }
        }

        function closeTab() {
            modalOverlay.style.display = 'none';
        }

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeTab();
        });
    </script>
</body>
</html>
