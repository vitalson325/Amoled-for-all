<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOLED Maker</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #00ff66;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            color: #888888;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .btn {
            width: 80%;
            max-width: 300px;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: 2px solid;
            background: transparent;
        }
        .btn-select {
            color: #00ff66;
            border-color: #00ff66;
        }
        .btn-process {
            color: #0088ff;
            border-color: #0088ff;
        }
        #status {
            margin-top: 30px;
            color: #ffaa00;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
        /* Скрываем стандартный инпут выбора файла */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <h1>AMOLED Maker</h1>
    <p>Конвертация APK в глубокий черный стиль</p>

    <!-- Скрытый системный выбор файлов -->
    <input type="file" id="fileInput" accept=".apk">

    <!-- Кнопки интерфейса -->
    <button class="btn btn-select" onclick="document.getElementById('fileInput').click()">Выбрать APK</button>
    <button class="btn btn-process" onclick="startProcess()">Сделать AMOLED</button>

    <div id="status">Готово к работе</div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        let selectedFile = null;

        fileInput.addEventListener('change', function(event) {
            if (event.target.files.length > 0) {
                selectedFile = event.target.files[0];
                statusDiv.textContent = `Выбран файл: ${selectedFile.name}`;
            }
        });

        function startProcess() {
            if (!selectedFile) {
                statusDiv.textContent = 'Сначала выберите APK-файл!';
                return;
            }
            statusDiv.textContent = `Обработка файла: ${selectedFile.name}...`;
            // Здесь в будущем добавим логику отправки / обработки
        }
    </script>

</body>
</html>
